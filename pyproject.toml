[project]
name = "hvac-duct-pressure-tool"
version = "0.1.0"
description = "DXF HVAC duct pressure calculation and axonometric diagram generator"
requires-python = ">=3.11"
dependencies = [
  "ezdxf>=1.3.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "networkx>=3.2.0",
  "svgwrite>=1.4.3",
  "click>=8.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
